name: Check admin backend

# Пінг Apps Script Web App (CONTENT_API_URL). Причина існування: грант OAuth власника скрипта
# періодично відмирав (4 і 16 вер. 2026), і тоді /exec віддавав 403 зі сторінкою відмови Google
# Диска — код doPost навіть не запускався. Ламало /admin, оформлення замовлень з кошика і
# відгуки, але каталог шин/дисків працював (він читає CSV таблиці напряму), тож зовні сайт
# виглядав живим. Двічі це виявляли вручну; цей воркфлоу знаходить поломку за ≤6 год.
# Першопричину усунуто 17 вер. 2026 (статус OAuth-згоди Testing → In production), але монітор
# лишається: він ловить і будь-яку іншу поломку бекенда, не лише відкликаний грант.
#
# Окремий воркфлоу, а не крок у deploy.yml — щоб мертвий бекенд не робив червоним деплой
# сайту: це незалежні поломки, і сайт має продовжувати деплоїтись.

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # URL не дублюємо — беремо з src/config.ts, єдиного місця для нього (див. CLAUDE.md).
      - name: Read CONTENT_API_URL from src/config.ts
        id: url
        run: |
          url="$(grep -oE 'https://script\.google\.com/macros/s/[A-Za-z0-9_-]+/exec' src/config.ts | head -1)"
          if [ -z "$url" ]; then
            echo "::error::Не знайшов CONTENT_API_URL у src/config.ts — змінився формат рядка?"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Probe /exec
        env:
          URL: ${{ steps.url.outputs.url }}
          ATTEMPTS: '3'
        run: |
          # Ретраї обов'язкові, а не про запас. 17 вер. 2026 монітор дав хибну тривогу: Google
          # віддав на редиректі script.googleusercontent.com звичайну HTML-сторінку з кодом 200
          # замість JSON, хоча бекенд був живий (три попередні прогони — успішні, зонд вручну
          # одразу після падіння — теж). Одна спроба перетворює такий чих Google на лист
          # "бекенд не працює", після чого монітору перестають вірити. Та сама логіка, що в
          # deploy.yml (wretry, 5 спроб) і build-product-images.mjs (3 спроби): зовнішній сервіс,
          # що іноді гикає, опитується з повтором.
          code=000
          for i in $(seq 1 "$ATTEMPTS"); do
            # Свідомо БЕЗ -X POST: він змушує curl повторити POST після 302-редиректу на
            # script.googleusercontent.com уже без тіла, і Google віддає збиваючий з пантелику
            # "411 Length Required" замість справжньої причини.
            code=$(curl -sS -L --max-time 60 \
              -o body.html -w '%{http_code}' \
              -H 'Content-Type: text/plain;charset=UTF-8' \
              --data '{"action":"__probe__"}' \
              "$URL") || code=000

            # Живий бекенд відповідає рівно цим — jsonResponse() з admin/apps-script/Code.gs
            # на невідому дію. Перевіряємо і код, і тіло: 200 з HTML-сторінкою не підходить.
            if [ "$code" = "200" ] && grep -q 'Невідома дія' body.html; then
              echo "Бекенд живий: HTTP 200, очікуване тіло (спроба $i з $ATTEMPTS)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "спроба $i з $ATTEMPTS: HTTP $code, тіло не те"
            # if-ом, а не '[ ... ] && sleep': GitHub запускає крок через bash -e, і хибний
            # && -список обвалив би весь крок на останній спробі.
            if [ "$i" -lt "$ATTEMPTS" ]; then sleep 20; fi
          done

          # Витягуємо <title> і текст без скриптів. head -c на сирому HTML тут не працює:
          # сторінки Google починаються з ~5 КБ інлайн-скрипта, тому перші 600 байт — це
          # завжди boilerplate, а не причина (саме так репорт 17 вер. вийшов порожнім).
          title="$(grep -o '<title>[^<]*</title>' body.html | head -1 | sed -e 's/<[^>]*>//g')"
          text="$(perl -0777 -pe 's{<script.*?</script>}{}gs; s{<style.*?</style>}{}gs; s{<[^>]+>}{ }g; s/\s+/ /g' body.html | head -c 400)"

          {
            echo "## Бекенд адмінки не відповідає"
            echo
            echo "- HTTP: \`$code\` (після $ATTEMPTS спроб)"
            echo "- URL: \`$URL\`"
            if [ -n "$title" ]; then echo "- Заголовок відповіді: **$title**"; fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          # Підпис сторінки відмови Google Диска = відкликаний OAuth-грант власника скрипта,
          # а не налаштування розгортання. Без цієї підказки діагностика щоразу йде хибним
          # шляхом (пароль / «Хто має доступ» / VPN / не той URL деплою).
          if grep -q 'request-access-icon\|drive-logo' body.html; then
            {
              echo "**Причина: відкликано OAuth-авторизацію власника скрипта** (у тілі — сторінка відмови Диска)."
              echo
              echo "Лікується без зміни URL і без правок у коді:"
              echo
              echo "1. Редактор Apps Script → запустити вручну \`testAuth\` (admin/apps-script/Code.gs)."
              echo "2. Пройти вікно авторизації до кінця, включно з «Додатково → Перейти до … (небезпечно)»."
              echo "3. Повторний деплой НЕ потрібен — перевірено 16 вер. 2026."
              echo
              echo "Якщо це повторилось після 17 вер. 2026 — перевірте, чи не повернувся статус"
              echo "OAuth-згоди в «Testing» (console.cloud.google.com/auth/audience, проєкт"
              echo "tire-place-admin): у ньому Google відкликає refresh-токен кожні 7 днів."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "Сторінки відмови Диска у відповіді немає — причина інша, ніж відкликаний грант."
              echo
              echo "Якщо тіло схоже на службову сторінку Google, а зонд вручну одразу віддає JSON —"
              echo "це був чих на боці Google, і три спроби його не перекрили. Перевірити вручну:"
              echo
              echo '```'
              echo "curl -sS -L -H 'Content-Type: text/plain;charset=UTF-8' --data '{\"action\":\"__probe__\"}' '$URL'"
              echo '```'
              echo
              echo "Текст відповіді без скриптів:"
              echo
              echo '```'
              echo "$text"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "::error::Бекенд адмінки віддав HTTP $code після $ATTEMPTS спроб — /admin, замовлення з кошика і відгуки не працюють"
          exit 1
