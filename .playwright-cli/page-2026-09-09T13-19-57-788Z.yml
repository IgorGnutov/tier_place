      - paragraph [ref=f1e92]:
        - paragraph [ref=f1e93]: "TIRE PLACE — автомагазин шин, дисків та акумуляторів у Кривому Розі, розташований на авторинку «Термінал» по вулиці Нікопольське шосе, 1Г. У нас можна придбати шини: літні, зимові та всесезонні для легкових авто, кросоверів і невеликих вантажних авто в розмірах від R13 до R22. Якщо не знаєте точний розмір шини — допоможемо з цим питання. Окремо представлені легкосплавні (литі) та штамповані диски, під будь-яке авто — з підбором за діаметром, шириною, розболтовкою (PCD) та вильотом (ET). Власний шиномонтаж на території магазину виконує балансування коліс, ремонт проколів, перебортування та сезонну заміну шин. Запишіться заздалегідь, щоб час та день був максимально зручним для вас. Також у продажу автомобільні акумулятори (АКБ) відомих виробників — Bosch, Varta, Westa, Fiamm, Rombat та інші — з підбором під Ваше авто. Магазин розташований на окремій парковці із зручним заїздом. Пишіть нам у Telegram, або телефонуйте, щоб уточнити ціну чи записатися на шиномонтаж."
      - paragraph [ref=f1e94]: "Доставка: самовивіз з магазину в Кривому Розі або Нова Пошта по всій Україні за тарифами перевізника. Повернення: 14 днів на товар належної якості — невживаний, з цілою упаковкою та комплектацією — згідно із Законом України «Про захист прав споживачів»."
