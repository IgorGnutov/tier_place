      - paragraph [ref=e302]: "TIRE PLACE — автомагазин шин, дисків та акумуляторів у Кривому Розі, розташований на авторинку «Термінал» по вулиці Нікопольське шосе. У нас можна купити шини Кривий Ріг: літні, зимові та всесезонні шини для легкових авто, кросоверів і невеликих вантажних авто в розмірах від R13 до R20. Окремо представлені легкосплавні (литі) та штамповані диски Кривий Ріг практично під будь-яке авто — з підбором за діаметром, шириною, розболтовкою (PCD) та вильотом (ET). Власний шиномонтаж на території магазину виконує балансування коліс, ремонт проколів, перебортування та сезонну заміну шин швидко і без тривалого очікування в черзі. Також у продажу автомобільні акумулятори (АКБ) відомих виробників — Bosch, Varta, Exide, Mutlu, Topla та інші — з підбором за ємністю, полярністю і габаритами. Якщо не знаєте точний розмір — підкажемо за номером авто чи розміром, вказаним на боковині старої шини. Магазин зручно розташований для мешканців Кривого Рогу та найближчих районів — заїжджайте на авторинок «Термінал» або пишіть нам у Telegram, щоб уточнити ціну чи записатися на шиномонтаж."
